name: AutoMind AI Windows CI Build
on:
  push:
    branches:
      - automind-ci-0.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble AutoMind AI source archive
        shell: powershell
        run: |
          $parts = Get-ChildItem -Path "automind_ci" -Filter "part*" | Sort-Object Name
          if ($parts.Count -lt 1) { throw "No source parts found." }
          $outPath = Join-Path $PWD "AutoMindAI-Source-0.1.0.zip"
          $stream = [System.IO.File]::Open($outPath, [System.IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $stream.Dispose()
          }
          Expand-Archive -Path $outPath -DestinationPath "." -Force
          if (-not (Test-Path "AutoMindAI\main.py")) { throw "Source extraction failed." }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AutoMindAI/requirements-dev.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows executable and installer
        shell: powershell
        working-directory: AutoMindAI
        run: .\scripts\build_windows.ps1 -SkipInstallTest

      - name: Strict packaged executable self-test
        shell: powershell
        working-directory: AutoMindAI
        run: |
          $PackagedExe = Join-Path $PWD "dist\AutoMindAI.exe"
          if (-not (Test-Path $PackagedExe)) { throw "Packaged executable missing." }
          $SelfTest = Start-Process -FilePath $PackagedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($SelfTest.ExitCode -ne 0) {
            throw "Packaged executable self-test failed with exit code $($SelfTest.ExitCode)."
          }

      - name: Install, self-test, and uninstall installer
        shell: powershell
        working-directory: AutoMindAI
        run: |
          $Installer = Join-Path $PWD "dist\installer\AutoMindAI-Setup.exe"
          if (-not (Test-Path $Installer)) { throw "Installer missing." }

          $TestDir = Join-Path $env:RUNNER_TEMP "AutoMindAI-InstallTest"
          $InstallLog = Join-Path $env:RUNNER_TEMP "AutoMindAI-InstallTest.log"
          Remove-Item -Recurse -Force $TestDir -ErrorAction SilentlyContinue
          Remove-Item -Force $InstallLog -ErrorAction SilentlyContinue

          $args = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$TestDir",
            "/LOG=$InstallLog"
          )
          Start-Process -FilePath $Installer -ArgumentList $args -Wait | Out-Null

          $InstalledExe = Join-Path $TestDir "AutoMindAI.exe"
          $deadline = (Get-Date).AddSeconds(45)
          while (-not (Test-Path $InstalledExe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $InstalledExe)) {
            if (Test-Path $InstallLog) { Get-Content $InstallLog -Tail 120 | Write-Host }
            throw "Installer QA failed: installed executable not found."
          }

          $InstalledSelfTest = Start-Process -FilePath $InstalledExe -ArgumentList "--self-test" -Wait -PassThru
          if ($InstalledSelfTest.ExitCode -ne 0) {
            throw "Installed executable self-test failed with exit code $($InstalledSelfTest.ExitCode)."
          }

          $Uninstaller = Join-Path $TestDir "unins000.exe"
          if (-not (Test-Path $Uninstaller)) { throw "Uninstaller missing after install." }
          Start-Process -FilePath $Uninstaller -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait | Out-Null

          $deadline = (Get-Date).AddSeconds(45)
          while ((Test-Path $InstalledExe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $InstalledExe) {
            throw "Uninstall QA failed: installed executable still exists."
          }

      - name: Upload AutoMind AI Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoMindAI-Windows-0.1.0
          if-no-files-found: error
          retention-days: 30
          path: |
            AutoMindAI/dist/AutoMindAI.exe
            AutoMindAI/dist/installer/AutoMindAI-Setup.exe
            AutoMindAI/dist/SHA256SUMS.txt
